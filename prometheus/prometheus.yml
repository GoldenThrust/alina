global:
  scrape_interval: 5s


scrape_configs:

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100


  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: fastify
    metrics_path: /metrics
    scheme: https

    tls_config:
      insecure_skip_verify: true

    static_configs:
      - targets:
          - 192.168.1.100:3155
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]